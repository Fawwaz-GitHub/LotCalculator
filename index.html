<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lot Calculator Application</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#f0f7ff',
                            100: '#e0effe',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom scrollbar and smooth transitions */
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] {
            -moz-appearance: textfield;
        }
        .fade-in {
            animation: fadeIn 0.25s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen pb-12">

    <!-- Header -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="p-2.5 bg-indigo-600 text-white rounded-xl shadow-md shadow-indigo-200">
                    <i class="fa-solid font-bold fa-calculator text-lg"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold text-slate-900 tracking-tight leading-none">Lot Calculator</h1>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <button onclick="clearAll()" class="inline-flex items-center gap-1.5 px-3 py-1.5 text-xs font-semibold text-rose-700 bg-rose-50 border border-rose-200 rounded-lg hover:bg-rose-100 transition">
                    <i class="fa-solid fa-rotate-left"></i> Clear All
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-6 space-y-6">

        <!-- Initial Lot Parameters Panel -->
        <section class="bg-white rounded-2xl p-6 border border-slate-200 shadow-sm">
            <div class="flex items-center gap-2 pb-4 mb-5 border-b border-slate-100">
                <div class="w-2 h-6 bg-indigo-600 rounded-full"></div>
                <h2 class="text-lg font-bold text-slate-900">Overall Lot</h2>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-3 gap-5">
                <!-- Selections Count Input -->
                <div>
                    <label for="numSelections" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">
                        Number of Selections
                    </label>
                    <div class="relative rounded-xl shadow-sm">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                            <i class="fa-solid fa-list-ol text-sm"></i>
                        </div>
                        <input type="number" id="numSelections" min="1" max="25" value="4" oninput="handleConfigChange()" 
                            class="block w-full pl-10 pr-3 py-2.5 text-slate-900 bg-slate-50 border border-slate-300 rounded-xl focus:bg-white focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-sm font-semibold transition" placeholder="e.g. 4">
                    </div>
                    <span class="text-[11px] text-slate-500 mt-1 block">Defines total table rows</span>
                </div>

                <!-- Total Quantity Count Input -->
                <div>
                    <label for="totalQuantity" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">
                        Total Quantity Count
                    </label>
                    <div class="relative rounded-xl shadow-sm">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                            <i class="fa-solid fa-boxes-stacked text-sm"></i>
                        </div>
                        <input type="number" id="totalQuantity" min="0" value="" oninput="handleConfigChange()" 
                            class="block w-full pl-10 pr-3 py-2.5 text-slate-900 bg-slate-50 border border-slate-300 rounded-xl focus:bg-white focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-sm font-semibold transition" placeholder="e.g. 1000">
                    </div>
                    <span class="text-[11px] text-slate-500 mt-1 block">Total items in the lot</span>
                </div>

                <!-- Rate Per Quantity Input -->
                <div>
                    <label for="ratePerQuantity" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">
                        Rate Per Quantity
                    </label>
                    <div class="relative rounded-xl shadow-sm">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                            <i class="fa-solid fa-tag text-sm"></i>
                        </div>
                        <input type="number" id="ratePerQuantity" step="any" min="0" value="" oninput="handleConfigChange()" 
                            class="block w-full pl-10 pr-3 py-2.5 text-slate-900 bg-slate-50 border border-slate-300 rounded-xl focus:bg-white focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-sm font-semibold transition" placeholder="e.g. 120">
                    </div>
                    <span class="text-[11px] text-slate-500 mt-1 block">Base average price per item</span>
                </div>
            </div>
        </section>

        <!-- Quantity Matching Status Banner -->
        <section class="bg-white rounded-2xl p-5 border border-slate-200 shadow-sm flex flex-col md:flex-row items-center justify-between gap-4">
            <div class="flex-1 w-full">
                <div class="flex items-center justify-between mb-2">
                    <span class="text-xs font-bold text-slate-700 uppercase tracking-wider flex items-center gap-2">
                        <i class="fa-solid fa-scale-balanced text-indigo-600"></i> Quantity Allocation Status
                    </span>
                    <span id="qtyAllocatedText" class="text-xs font-bold text-slate-900">0 / 0 Allocated (0%)</span>
                </div>
                <!-- Progress Bar -->
                <div class="w-full h-3 bg-slate-100 rounded-full overflow-hidden p-0.5 border border-slate-200">
                    <div id="qtyProgressBar" class="h-full bg-indigo-600 rounded-full transition-all duration-300" style="width: 0%"></div>
                </div>
            </div>
            <div id="qtyStatusBadge" class="px-3.5 py-2 rounded-xl text-xs font-bold flex items-center gap-2 bg-amber-50 text-amber-700 border border-amber-200 whitespace-nowrap">
                <i class="fa-solid fa-triangle-exclamation"></i> Quantities do not match Total
            </div>
        </section>

        <!-- Step 2: Selection Matrix Table -->
        <section class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
            <div class="p-6 border-b border-slate-100 flex items-center justify-between gap-3">
                <div class="flex items-center gap-2">
                    <div class="w-2 h-6 bg-emerald-500 rounded-full"></div>
                    <h2 class="text-lg font-bold text-slate-900">Selections</h2>
                </div>
            </div>

            <!-- Table Wrapper -->
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse min-w-[650px]">
                    <thead>
                        <tr class="bg-slate-50/80 text-slate-600 text-xs font-bold uppercase tracking-wider border-b border-slate-200">
                            <th class="py-4 px-4 sm:px-5">Selection</th>
                            <th class="py-4 px-4 sm:px-5 w-40 sm:w-48">Selection Qty</th>
                            <th class="py-4 px-4 sm:px-5 w-32 sm:w-40 text-center">Selection %</th>
                            <th class="py-4 px-4 sm:px-5 w-40 sm:w-48">Per Piece Rate</th>
                            <th class="py-4 px-4 sm:px-5 w-48 sm:w-56 text-right">Calculated Rate</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody" class="divide-y divide-slate-200 text-sm">
                        <!-- Dynamic Rows Injection -->
                    </tbody>
                </table>
            </div>
        </section>

    </main>

    <script>
        // Toggle flag to divide calculated rate by 10 (Set to false if you wish to revert)
        const DIVIDE_CALCULATED_RATE_BY_TEN = true;

        // State object holding configuration and row data
        let state = {
            numSelections: 4,
            totalQuantity: 0,
            ratePerQuantity: 0,
            rows: [
                { qty: '', rate: '' },
                { qty: '', rate: '' },
                { qty: '', rate: '' },
                { qty: '', rate: '' }
            ]
        };

        window.onload = function() {
            readInputsFromDOM();
            renderTable();
            recalculate();
        };

        // Read initial config from inputs
        function readInputsFromDOM() {
            const numSelInput = document.getElementById('numSelections').value;
            const totalQtyInput = document.getElementById('totalQuantity').value;
            const rateInput = document.getElementById('ratePerQuantity').value;

            state.numSelections = Math.max(1, parseInt(numSelInput) || 1);
            state.totalQuantity = Math.max(0, parseFloat(totalQtyInput) || 0);
            state.ratePerQuantity = Math.max(0, parseFloat(rateInput) || 0);

            // Adjust rows array length
            while (state.rows.length < state.numSelections) {
                state.rows.push({ qty: '', rate: '' });
            }
            if (state.rows.length > state.numSelections) {
                state.rows = state.rows.slice(0, state.numSelections);
            }
        }

        function handleConfigChange() {
            readInputsFromDOM();
            renderTable();
            recalculate();
        }

        function renderTable() {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            for (let i = 0; i < state.numSelections; i++) {
                const rowData = state.rows[i] || { qty: '', rate: '' };

                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-50/80 transition-colors";

                tr.innerHTML = `
                    <td class="py-3.5 px-4 sm:px-5 font-semibold text-slate-800 whitespace-nowrap">
                        <div class="flex items-center gap-2">
                            <span class="w-6 h-6 rounded-full bg-indigo-100 text-indigo-700 font-bold text-xs flex items-center justify-center shrink-0">${i + 1}</span>
                            <span>Selection ${i + 1}</span>
                        </div>
                    </td>
                    <td class="py-3.5 px-4 sm:px-5">
                        <div class="relative">
                            <input type="number" min="0" value="${rowData.qty !== undefined ? rowData.qty : ''}" 
                                oninput="handleRowChange(${i}, 'qty', this.value)"
                                placeholder="Qty"
                                class="w-full px-3 py-1.5 text-slate-900 bg-slate-50 border border-slate-300 rounded-lg focus:bg-white focus:ring-2 focus:ring-indigo-500 text-sm font-medium transition">
                        </div>
                    </td>
                    <td class="py-3.5 px-4 sm:px-5 text-center font-semibold text-slate-700 whitespace-nowrap" id="percent-col-${i}">
                        0.00%
                    </td>
                    <td class="py-3.5 px-4 sm:px-5">
                        <div class="relative">
                            <input type="number" step="any" min="0" value="${rowData.rate !== undefined ? rowData.rate : ''}" 
                                oninput="handleRowChange(${i}, 'rate', this.value)"
                                placeholder="Rate"
                                class="w-full px-3 py-1.5 text-slate-900 bg-slate-50 border border-slate-300 rounded-lg focus:bg-white focus:ring-2 focus:ring-indigo-500 text-sm font-medium transition">
                        </div>
                    </td>
                    <td class="py-3.5 px-4 sm:px-5 text-right font-bold text-slate-900 whitespace-nowrap" id="calc-col-${i}">
                        <span class="text-xs font-normal text-slate-400 italic">Pending Input</span>
                    </td>
                `;
                tbody.appendChild(tr);
            }
        }

        function handleRowChange(index, field, value) {
            state.rows[index][field] = value === '' ? '' : parseFloat(value);
            recalculate();
        }

        function recalculate() {
            const overallTotal = state.totalQuantity * state.ratePerQuantity;

            // 1. Calculate selection percentages for all rows
            let sumQtyAllocated = 0;
            const percentages = [];

            for (let i = 0; i < state.numSelections; i++) {
                const q = parseFloat(state.rows[i].qty) || 0;
                sumQtyAllocated += q;

                let pct = 0;
                if (state.totalQuantity > 0) {
                    pct = (q / state.totalQuantity) * 100;
                }
                percentages[i] = pct;

                // Render Col 3 (Selection Percentage)
                const pctElem = document.getElementById(`percent-col-${i}`);
                if (pctElem) {
                    pctElem.textContent = pct.toFixed(2) + '%';
                }
            }

            // 2. Update Quantity allocation status bar
            updateQtyProgress(sumQtyAllocated);

            // 3. Calculate Col 5 (Calculated Rate) for each row
            for (let i = 0; i < state.numSelections; i++) {
                const calcCell = document.getElementById(`calc-col-${i}`);
                if (!calcCell) continue;

                // Check if current row input has been completed (both qty and rate filled)
                const currentQtyFilled = state.rows[i].qty !== '' && state.rows[i].qty !== null && !isNaN(state.rows[i].qty);
                const currentRateFilled = state.rows[i].rate !== '' && state.rows[i].rate !== null && !isNaN(state.rows[i].rate);

                if (currentQtyFilled && currentRateFilled) {
                    // Compute numerator: overalltotal - sum of (above & current row rate * quantity)
                    let sumDeductions = 0;
                    for (let k = 0; k <= i; k++) {
                        const q_k = parseFloat(state.rows[k].qty) || 0;
                        const r_k = parseFloat(state.rows[k].rate) || 0;
                        sumDeductions += (q_k * r_k);
                    }
                    const numerator = overallTotal - sumDeductions;

                    // Compute denominator: sum of below rows selection percentage
                    let denominatorPct = 0;
                    for (let j = i + 1; j < state.numSelections; j++) {
                        denominatorPct += percentages[j];
                    }

                    if (i === state.numSelections - 1) {
                        // Last row - no below rows
                        calcCell.innerHTML = `<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-slate-100 text-slate-600">Final Row (0 Below)</span>`;
                    } else if (denominatorPct <= 0) {
                        calcCell.innerHTML = `<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-amber-100 text-amber-800">0% Below Sum</span>`;
                    } else {
                        let calculatedRate = numerator / denominatorPct;

                        // Apply divide by 10 fix
                        if (DIVIDE_CALCULATED_RATE_BY_TEN) {
                            calculatedRate = calculatedRate / 10;
                        }

                        calcCell.innerHTML = `
                            <div class="fade-in">
                                <span class="text-base text-indigo-700 font-extrabold">${formatNumber(calculatedRate)}</span>
                            </div>
                        `;
                    }
                } else {
                    // Current row input incomplete -> show pending state
                    calcCell.innerHTML = `<span class="text-xs font-normal text-slate-400 italic">Pending Input</span>`;
                }
            }
        }

        function updateQtyProgress(sumQty) {
            const total = state.totalQuantity;
            const pct = total > 0 ? Math.min(100, (sumQty / total) * 100) : 0;
            
            const progressBar = document.getElementById('qtyProgressBar');
            const qtyText = document.getElementById('qtyAllocatedText');
            const qtyBadge = document.getElementById('qtyStatusBadge');

            if (!progressBar || !qtyText || !qtyBadge) return;

            progressBar.style.width = `${pct}%`;
            qtyText.textContent = `${formatNumber(sumQty)} / ${formatNumber(total)} Allocated (${pct.toFixed(1)}%)`;

            if (Math.abs(sumQty - total) < 0.001 && total > 0) {
                progressBar.className = "h-full bg-emerald-500 rounded-full transition-all duration-300";
                qtyBadge.className = "px-3 py-1.5 sm:px-3.5 sm:py-2 rounded-xl text-xs font-bold flex items-center gap-2 bg-emerald-50 text-emerald-700 border border-emerald-200 whitespace-nowrap";
                qtyBadge.innerHTML = `<i class="fa-solid fa-circle-check"></i> Quantity Matched Exact (${formatNumber(total)})`;
            } else if (sumQty > total && total > 0) {
                progressBar.className = "h-full bg-rose-500 rounded-full transition-all duration-300";
                qtyBadge.className = "px-3 py-1.5 sm:px-3.5 sm:py-2 rounded-xl text-xs font-bold flex items-center gap-2 bg-rose-50 text-rose-700 border border-rose-200 whitespace-nowrap";
                qtyBadge.innerHTML = `<i class="fa-solid fa-circle-xmark"></i> Exceeds Total by ${formatNumber(sumQty - total)}`;
            } else {
                progressBar.className = "h-full bg-indigo-600 rounded-full transition-all duration-300";
                qtyBadge.className = "px-3 py-1.5 sm:px-3.5 sm:py-2 rounded-xl text-xs font-bold flex items-center gap-2 bg-amber-50 text-amber-700 border border-amber-200 whitespace-nowrap";
                qtyBadge.innerHTML = `<i class="fa-solid fa-triangle-exclamation"></i> Remaining: ${formatNumber(total - sumQty)}`;
            }
        }

        function formatNumber(val) {
            if (isNaN(val) || !isFinite(val)) return '0.00';
            return val.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        function clearAll() {
            document.getElementById('numSelections').value = 4;
            document.getElementById('totalQuantity').value = '';
            document.getElementById('ratePerQuantity').value = '';

            state.numSelections = 4;
            state.totalQuantity = 0;
            state.ratePerQuantity = 0;
            state.rows = [
                { qty: '', rate: '' },
                { qty: '', rate: '' },
                { qty: '', rate: '' },
                { qty: '', rate: '' }
            ];

            renderTable();
            recalculate();
        }
    </script>
</body>
</html>
